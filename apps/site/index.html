<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PegPay — crédito sem enrolação para quem o banco não enxerga. Empréstimo com cartão de crédito, consignado CLT e empréstimo com garantia de veículo ou imóvel. Fale com gente de verdade."
    />
    <meta name="theme-color" content="#E94E1B" />
    <link rel="canonical" href="https://www.pegpay.com.br/" />

    <!-- Open Graph / compartilhamento em WhatsApp e redes. O WhatsApp é o
         canal de conversão do site, então o preview do link importa. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PegPay" />
    <meta property="og:title" content="PegPay — Crédito sem enrolação" />
    <meta
      property="og:description"
      content="Crédito para quem o banco não enxerga. Empréstimo com cartão, consignado CLT e com garantia de veículo ou imóvel. Do outro lado tem gente de verdade."
    />
    <meta property="og:url" content="https://www.pegpay.com.br/" />
    <meta property="og:image" content="https://www.pegpay.com.br/images/hero-credito.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 0H74L100 26V100H0Z' fill='%23E94E1B'/%3E%3Cpath d='M22 22h16v56H22z M38 22h28v14H38z M52 22h14v42H52z M38 50h28v14H38z' fill='%23F3F2F2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PegPay — Crédito sem enrolação</title>

    <!--
      Google Consent Mode v2 — bootstrap.
      Precisa rodar antes de qualquer script do Google (gtag.js, Ads) ser
      carregado, por isso fica inline no <head> e não dentro do bundle React.
      Estado default: tudo negado. src/lib/analytics.ts atualiza esse estado
      quando o usuário decide no banner de cookies, e só injeta o gtag.js se
      houver um Measurement ID real configurado via variável de ambiente.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
        wait_for_update: 500,
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
